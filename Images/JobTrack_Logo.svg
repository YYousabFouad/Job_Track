<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0E2337"/>

  <!-- Pin / marker shape -->
  <g transform="translate(60, 60)">
    <path d="M140 0
             C 76 0, 24 51, 24 115
             C 24 197, 108 260, 136 293
             C 138.5 296, 141.5 296, 144 293
             C 172 260, 256 197, 256 115
             C 256 51, 204 0, 140 0
             Z"
          fill="url(#pinGradient)"/>

    <!-- Inner hole (cut-out) -->
    <circle cx="140" cy="118" r="66" fill="#0E2337"/>

    <!-- Checkmark inside the hole -->
    <path d="M108 122 L132 146 L182 90"
          fill="none"
          stroke="url(#pinGradient)"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Checkmark tail extending beyond the pin outline -->
    <path d="M132 146 L182 90 L232 40"
          fill="none"
          stroke="#5EEAD4"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="240"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="150"
        fill="#FFFFFF">JobTrack</text>
</svg>
